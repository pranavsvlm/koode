plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.koodecallui'
version = '0.1.0'

android {
  namespace "expo.modules.koodecallui"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // LiveKit's WebRTC build: KoodeVideoView renders its video tracks.
  implementation project(':livekit_react-native-webrtc')
}
